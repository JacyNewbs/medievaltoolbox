<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Guide — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #f5ead0;
      color: #3a2e1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #faf3e3;
      border: 1px solid #d4c5a0;
      border-radius: 4px;
      padding: 48px 40px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #7a5c14;
      font-weight: 600;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      color: #2a1e0e;
      margin-bottom: 6px;
    }
    .sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 14px;
      color: #7a6a4a;
      font-style: italic;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #7a5c14;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: left;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d4c5a0;
      border-radius: 2px;
      background: #fff8eb;
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 16px;
      color: #2a1e0e;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #b0a070; }
    button {
      width: 100%;
      padding: 12px;
      background: #2a1e0e;
      color: #f5ead0;
      border: none;
      border-radius: 2px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3a2e1e; }
    #err {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 13px;
      color: #8b2020;
      font-style: italic;
      margin-top: 12px;
      min-height: 18px;
    }
    .back {
      display: block;
      margin-top: 24px;
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 13px;
      color: #9a8a6a;
      text-decoration: none;
    }
    .back:hover { color: #5a3824; }
  </style>
</head>
<body>
  <div class="box">
    <div class="tag">Medieval Toolbox — Testing Room</div>
    <h1>AR Assembly Guide</h1>
    <p class="sub">Enter the access password to continue</p>

    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off" autofocus
           placeholder="••••••••">
    <button id="go">Enter</button>
    <div id="err"></div>

    <a href="index.html" class="back">← Return to Toolbox</a>
  </div>

  <script>
    const HASH = '9e7cd9cb5a63a3591e16f4d835f32a1c4a84ab66e39ae27aa448c03b66bf63e7';
    const KEY  = 'ar_auth';
    const DEST = 'ar-minster-guide.html';

    async function sha256(str) {
      const buf = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(str)
      );
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function attempt() {
      const pw = document.getElementById('pw').value;
      const hash = await sha256(pw);
      if (hash === HASH) {
        sessionStorage.setItem(KEY, HASH);
        window.location.href = DEST;
      } else {
        document.getElementById('err').textContent = 'Incorrect password.';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }

    document.getElementById('go').addEventListener('click', attempt);
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') attempt();
    });
  </script>
</body>
</html>
