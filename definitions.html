<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Match the Definitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e36c22;
    --on-bg: #2b1305;
    --panel: #ffffff;
    --ink: #1f2d3d;
    --muted: #5d6b7a;
    --floor: #f5f8f7;
    --line: #cfdad6;
    --blue: #1f6f9f;
    --blue-soft: #b6d6e8;
    --pink: #d6336c;
    --good: #2e8b57;
    --good-soft: #dff2e6;
    --bad: #c0392b;
    --bad-soft: #fbe3e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--on-bg);
    font-family: "Libre Baskerville", Baskerville, "Baskerville Old Face", Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 820px; }

  h1 { font-size: 1.25rem; line-height: 1.3; font-weight: 700; margin: 0 0 6px; }
  .hint { margin: 0 0 16px; font-size: 0.9rem; line-height: 1.5; }

  .board {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    column-gap: clamp(36px, 12vw, 110px);
  }
  .col { display: grid; grid-template-rows: repeat(4, 1fr); gap: 14px; position: relative; z-index: 2; }

  .item {
    position: relative;
    background: var(--floor);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .item.word { font-weight: 700; font-size: 0.95rem; justify-content: center; text-align: center; }
  .item.def { font-size: 0.78rem; line-height: 1.5; }
  .item:hover { border-color: var(--blue); }
  .item:focus-visible { box-shadow: 0 0 0 3px var(--pink); }

  /* connector dots */
  .item::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    margin-top: -8px;
    border-radius: 50%;
    background: var(--blue);
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line);
  }
  .item.word::after { right: -11px; }
  .item.def::after  { left: -11px; }

  .item.selected { border-color: var(--pink); background: #fdeaf1; }
  .item.selected::after { background: var(--pink); }
  .item.matched { border-color: var(--good); background: var(--good-soft); cursor: default; }
  .item.matched::after { background: var(--good); }
  .item.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake 0.45s; }
  .item.wrong::after { background: var(--bad); }
  @keyframes shake {
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .item.pop { animation: pop 0.4s; }
  @keyframes pop { 40% { transform: scale(1.04); } }

  svg#lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
  svg#lines path { fill: none; stroke-width: 4; stroke-linecap: round; }
  .l-drag  { stroke: var(--blue); stroke-dasharray: 2 8; }
  .l-good  { stroke: var(--good); }
  .l-bad   { stroke: var(--bad); animation: fadeLine 0.9s forwards; }
  @keyframes fadeLine { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

  .status {
    min-height: 4.5rem;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .message { margin: 0; font-size: 1.05rem; line-height: 1.5; }
  .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 0.95rem;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
    border: 2px solid var(--blue);
    background: var(--blue);
    color: #fff;
  }
  button.secondary { background: var(--panel); color: var(--blue); }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @media (max-width: 560px) {
    .board { padding: 14px; grid-template-columns: 1fr 1.7fr; }
    .item { padding: 10px 8px; }
    .item.word { font-size: 0.78rem; }
    .item.def { font-size: 0.68rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item.wrong, .item.pop { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Match each schedule to its definition</h1>
  <p class="hint">Drag from a word to its definition, or click one and then the other.</p>

  <div class="board" id="board">
    <svg id="lines" aria-hidden="true"></svg>
    <div class="col" id="words"></div>
    <div class="col" id="defs"></div>
  </div>

  <div class="status">
    <p class="message" id="message" aria-live="polite">Make your first match.</p>
    <div class="buttons">
      <button id="mixBtn">Mix up</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>
  </div>
</main>

<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  const ITEMS = [
    { id: 'fi', word: 'Fixed-Interval',    def: 'The learner is reinforced for a behaviour after a set amount of time has passed.' },
    { id: 'vi', word: 'Variable-Interval', def: 'The learner is reinforced for a behaviour after an unpredictable and average amount of time.' },
    { id: 'fr', word: 'Fixed-Ratio',       def: 'The learner is reinforced after a set number of responses.' },
    { id: 'vr', word: 'Variable-Ratio',    def: 'The learner is reinforced after an average number of responses and unpredictably.' }
  ];
  const START_WORDS = ['fi', 'vi', 'fr', 'vr'];
  const START_DEFS  = ['fr', 'vr', 'fi', 'vi'];   // starts out of line with the words

  const board = document.getElementById('board');
  const svg = document.getElementById('lines');
  const wordsEl = document.getElementById('words');
  const defsEl = document.getElementById('defs');
  const msg = document.getElementById('message');
  const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));

  let wordOrder = START_WORDS.slice();
  let defOrder = START_DEFS.slice();
  let matched = new Set();
  let selection = null;        // { side, id }
  let temp = [];               // wrong-answer lines shown briefly
  let drag = null;             // { side, id, x0, y0, moved, x, y }

  /* ---------- Sound (ding.ogg must be in the same folder) ---------- */
  const ding = new Audio('ding.ogg');
  ding.preload = 'auto';
  function playDing() {
    try { ding.currentTime = 0; const p = ding.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }

  /* ---------- Confetti ---------- */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('confetti');
  const cx = cv.getContext('2d');
  let particles = [], running = false;
  const COLORS = ['#d6336c', '#f2b705', '#2a9d8f', '#3a86ff', '#ff7f50', '#8e5cf7', '#7bd389'];

  function sizeConfetti() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', sizeConfetti);
  sizeConfetti();

  function burst(x, y, count, centerAngle, spread, minV, maxV) {
    for (let i = 0; i < count; i++) {
      const a = centerAngle + (Math.random() - 0.5) * spread;
      const v = minV + Math.random() * (maxV - minV);
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 0, max: 150 + Math.random() * 100
      });
    }
  }

  function spray(x, y) {
    burst(x, y, reduceMotion ? 30 : 110, -Math.PI / 2, Math.PI * 0.9, 7, 18);
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => p.life < p.max && p.y < innerHeight + 30);
    for (const p of particles) {
      p.life++;
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.32;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save();
      cx.globalAlpha = Math.min(1, (p.max - p.life) / 40);
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.color;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  /* ---------- Build lists ---------- */
  function makeItem(side, id) {
    const el = document.createElement('div');
    el.className = 'item ' + side;
    el.dataset.side = side;
    el.dataset.id = id;
    el.tabIndex = 0;
    el.textContent = side === 'word' ? byId[id].word : byId[id].def;
    if (matched.has(id)) el.classList.add('matched');
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(side, id); }
    });
    return el;
  }

  function buildLists() {
    wordsEl.replaceChildren(...wordOrder.map(id => makeItem('word', id)));
    defsEl.replaceChildren(...defOrder.map(id => makeItem('def', id)));
    render();
  }

  const elFor = (side, id) => board.querySelector(`.item[data-side="${side}"][data-id="${id}"]`);

  /* ---------- Lines ---------- */
  function anchor(side, id) {
    const b = board.getBoundingClientRect();
    const r = elFor(side, id).getBoundingClientRect();
    return { x: (side === 'word' ? r.right : r.left) - b.left, y: r.top + r.height / 2 - b.top };
  }

  function curve(a, b) {
    const dx = Math.max(30, Math.abs(b.x - a.x) * 0.5);
    return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
  }

  function addPath(d, cls) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', cls);
    svg.appendChild(p);
  }

  function render() {
    svg.replaceChildren();
    matched.forEach(id => addPath(curve(anchor('word', id), anchor('def', id)), 'l-good'));
    temp.forEach(t => addPath(curve(anchor('word', t.w), anchor('def', t.d)), 'l-bad'));
    if (drag && drag.moved) {
      const b = board.getBoundingClientRect();
      const from = anchor(drag.side, drag.id);
      const to = { x: drag.x - b.left, y: drag.y - b.top };
      addPath(drag.side === 'word' ? curve(from, to) : curve(to, from), 'l-drag');
    }
  }

  /* ---------- Matching logic ---------- */
  function setMessage(t) { msg.textContent = t; }

  function attempt(wordId, defId) {
    clearSelection();
    if (wordId === defId) {
      matched.add(wordId);
      [elFor('word', wordId), elFor('def', defId)].forEach(el => {
        el.classList.remove('selected');
        el.classList.add('matched', 'pop');
      });
      playDing();
      const r = elFor('def', defId).getBoundingClientRect();
      spray(r.left + r.width / 2, r.top + r.height / 2);
      if (matched.size === ITEMS.length) {
        setMessage('All four matched. Well done!');
      } else {
        setMessage('Correct! ' + byId[wordId].word + ' matched. ' + (ITEMS.length - matched.size) + ' to go.');
      }
    } else {
      const w = elFor('word', wordId), d = elFor('def', defId);
      const t = { w: wordId, d: defId };
      temp.push(t);
      [w, d].forEach(el => { el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); });
      setMessage('Not quite. That definition belongs to a different schedule. Try again.');
      setTimeout(() => {
        temp = temp.filter(x => x !== t);
        [w, d].forEach(el => el.classList.remove('wrong'));
        render();
      }, 900);
    }
    render();
  }

  function clearSelection() {
    if (selection) {
      const el = elFor(selection.side, selection.id);
      if (el) el.classList.remove('selected');
    }
    selection = null;
  }

  function choose(side, id) {
    if (matched.has(id)) return;
    if (selection && selection.side !== side) {
      const wordId = side === 'word' ? id : selection.id;
      const defId = side === 'def' ? id : selection.id;
      attempt(wordId, defId);
    } else if (selection && selection.side === side && selection.id === id) {
      clearSelection();
    } else {
      clearSelection();
      selection = { side, id };
      elFor(side, id).classList.add('selected');
    }
  }

  /* ---------- Pointer handling ---------- */
  function onDown(e) {
    const el = e.currentTarget;
    const id = el.dataset.id;
    if (matched.has(id)) return;
    drag = { side: el.dataset.side, id, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false };
    el.setPointerCapture(e.pointerId);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onCancel);
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.moved && Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 6) {
      drag.moved = true;
      clearSelection();
      elFor(drag.side, drag.id).classList.add('selected');
    }
    if (drag.moved) render();
  }

  function finish(el) {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onCancel);
  }

  function onUp(e) {
    const el = e.currentTarget;
    finish(el);
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) {
      el.classList.remove('selected');
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const item = target && target.closest('.item');
      if (item && item.dataset.side !== d.side && !matched.has(item.dataset.id)) {
        const wordId = d.side === 'word' ? d.id : item.dataset.id;
        const defId = d.side === 'def' ? d.id : item.dataset.id;
        attempt(wordId, defId);
        return;
      }
      render();
    } else {
      choose(d.side, d.id);
    }
  }

  function onCancel(e) {
    finish(e.currentTarget);
    if (drag) elFor(drag.side, drag.id)?.classList.remove('selected');
    drag = null;
    render();
  }

  /* ---------- Buttons ---------- */
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  document.getElementById('mixBtn').addEventListener('click', () => {
    matched = new Set(); temp = []; drag = null; selection = null;
    let w, d;
    do {
      w = shuffled(wordOrder); d = shuffled(defOrder);
    } while (w.join() === wordOrder.join() && d.join() === defOrder.join());
    wordOrder = w; defOrder = d;
    buildLists();
    setMessage('Mixed up and reset. Make your first match.');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    matched = new Set(); temp = []; drag = null; selection = null;
    wordOrder = START_WORDS.slice();
    defOrder = START_DEFS.slice();
    buildLists();
    setMessage('Make your first match.');
  });

  addEventListener('resize', render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);

  buildLists();
})();
</script>
</body>
</html>
