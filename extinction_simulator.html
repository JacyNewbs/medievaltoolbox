<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extinction Experiment</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f3f4f6;
    color: #20242b;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  main {
    width: min(520px, 100%);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 1.45rem;
    font-weight: 600;
  }

  p {
    margin: 0 0 26px;
    color: #626975;
    font-size: .95rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
  }

  .choice {
    aspect-ratio: 1.35;
    border: 0;
    border-radius: 12px;
    background: #d9e2ec;
    box-shadow: 0 3px 0 #b8c5d3;
    cursor: pointer;
    transition: transform .12s, background .15s, box-shadow .12s;
    -webkit-tap-highlight-color: transparent;
  }

  .choice:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b8c5d3;
  }

  .choice.reward {
    background: #72d6a0;
    box-shadow: 0 3px 0 #42a976;
  }

  .choice:focus-visible {
    outline: 3px solid #273b55;
    outline-offset: 3px;
  }

  /* Static canvas overlay to freeze confetti mid-air */
  #freezeFrame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    display: none;
    pointer-events: none;
  }

  /* Keep buttons non-interactive after freeze */
  .choice.frozen {
    pointer-events: none;
    cursor: default;
    transition: none !important;
  }

  .choice.reward.frozen {
    transform: translateY(2px) !important;
    background: #72d6a0;
    box-shadow: 0 1px 0 #42a976 !important;
  }

  body.frozen {
    user-select: none;
  }

  /* Overlay and Dialog styles */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 22px;
    background: rgba(20, 25, 32, .48);
    opacity: 0;
    visibility: hidden;
    transition: opacity .7s ease, visibility .7s;
    z-index: 20;
  }

  .overlay.show {
    opacity: 1;
    visibility: visible;
  }

  #overlay1 {
    pointer-events: none; /* Allows clicks through the transparent container */
  }

  .dialog {
    width: min(390px, 100%);
    padding: 30px 24px;
    border-radius: 16px;
    background: white;
    box-shadow: 0 16px 55px rgba(0,0,0,.2);
    text-align: center;
    pointer-events: auto;
  }

  .dialog h2 {
    margin: 0 0 12px;
    font-size: 1.35rem;
  }

  .dialog p {
    margin: 0 0 22px;
    line-height: 1.5;
  }

  .refresh {
    border: 0;
    border-radius: 9px;
    padding: 12px 22px;
    background: #263b53;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }

  .refresh:hover {
    background: #182a3e;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
</head>

<body>
<main>
  <h1>Choose a button</h1>
  <p>Find the button. Fill the screen with confetti.</p>

  <div class="grid" id="grid" aria-label="Button choices">
    <button class="choice" type="button" aria-label="Choice 1"></button>
    <button class="choice" type="button" aria-label="Choice 2"></button>
    <button class="choice" type="button" aria-label="Choice 3"></button>
    <button class="choice" type="button" aria-label="Choice 4"></button>
    <button class="choice" type="button" aria-label="Choice 5"></button>
    <button class="choice" type="button" aria-label="Choice 6"></button>
    <button class="choice" type="button" aria-label="Choice 7"></button>
    <button class="choice" type="button" aria-label="Choice 8"></button>
    <button class="choice" type="button" aria-label="Choice 9"></button>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="question">
  <div class="dialog">
    <h2 id="question">Did you experience an extinction?</h2>
    <p>Try again?</p>
    <button class="refresh" onclick="location.reload()">Refresh</button>
  </div>
</div>

<div class="overlay" id="overlay1" role="dialog" aria-modal="true" aria-labelledby="question" style="justify-content: right; background-color: transparent;">
  <div class="dialog">
    <h2>Keep Going!</h2>
  </div>
</div>

<canvas id="freezeFrame" aria-hidden="true"></canvas>

<script>
(() => {
  const buttons = [...document.querySelectorAll('.choice')];
  const freezeFrame = document.getElementById('freezeFrame');
  const freezeContext = freezeFrame.getContext('2d');

  const target = Math.floor(Math.random() * buttons.length);
  const audio = new Audio('ding.ogg');

  let reinforcedTaps = 0;
  let finished = false;

  function freezeExperiment() {
    if (finished) return;

    finished = true;
    document.body.classList.add('frozen');

    // Freeze target button state
    if (reinforcedTaps > 0) {
      buttons[target].classList.add('reward', 'frozen');
    }

    // Disable all choice buttons
    buttons.forEach(button => {
      button.disabled = true;
      button.classList.add('frozen');
      button.blur();
    });

    requestAnimationFrame(() => {
      // Find all canvas elements currently on the page
      const canvases = [...document.querySelectorAll('canvas')].filter(c => c !== freezeFrame);

      // Match target canvas dimensions
      const activeCanvas = canvases[0];
      if (activeCanvas) {
        freezeFrame.width = activeCanvas.width;
        freezeFrame.height = activeCanvas.height;
        freezeContext.drawImage(activeCanvas, 0, 0);
      }

      // Display the static freeze frame canvas
      freezeFrame.style.display = 'block';

      // Halt the library and remove all active canvases created by the library
      if (typeof confetti !== 'undefined') {
        if (confetti.pause) confetti.pause();
        if (confetti.reset) confetti.reset();
      }
      canvases.forEach(c => c.remove());
    });
  }

  buttons.forEach((button, index) => {
    button.addEventListener('click', (event) => {
      if (finished || index !== target) return;

      reinforcedTaps += 1;

      if (typeof confetti === 'function') {
        confetti({
          position: {
            x: event.clientX,
            y: event.clientY
          }
        });
      }

      audio.currentTime = 0;
      audio.play().catch(() => {});

      button.classList.add('reward');

      if (reinforcedTaps < 15) {
        window.setTimeout(() => {
          if (!finished) button.classList.remove('reward');
        }, 260);
      } else if (reinforcedTaps === 15) {
        freezeExperiment();
        window.setTimeout(() => {
          document.getElementById('overlay1').classList.add('show');
        }, 20);
      }
    });
  });

  // Timer to freeze and display the final dialogue box overlay
  window.setTimeout(() => {
    freezeExperiment();
    
    // Hide the 'Keep Going!' message when the final overlay appears
    const keepGoingOverlay = document.getElementById('overlay1');
    keepGoingOverlay.classList.remove('show');
    keepGoingOverlay.style.display = 'none';

    document.getElementById('overlay').classList.add('show');
  }, 20000);
})();
</script>
</body>
</html>
