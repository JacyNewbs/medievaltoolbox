<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extinction Experiment</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #f3f4f6; color: #20242b;
    font-family: Arial, Helvetica, sans-serif;
  }
  main { width: min(520px, 100%); text-align: center; }
  h1 { margin: 0 0 10px; font-size: 1.45rem; font-weight: 600; }
  p { margin: 0 0 26px; color: #626975; font-size: .95rem; }
  .grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px; width: 100%;
  }
  .choice {
    aspect-ratio: 1.35; border: 0; border-radius: 12px;
    background: #d9e2ec; box-shadow: 0 3px 0 #b8c5d3;
    cursor: pointer; transition: transform .12s, background .15s, box-shadow .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .choice:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8c5d3; }
  .choice.reward { background: #72d6a0; box-shadow: 0 3px 0 #42a976; }
  .choice:focus-visible { outline: 3px solid #273b55; outline-offset: 3px; }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 22px; background: rgba(20, 25, 32, .48);
    opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility .7s;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .dialog {
    width: min(390px, 100%); padding: 30px 24px; border-radius: 16px;
    background: white; box-shadow: 0 16px 55px rgba(0,0,0,.2);
  }
  .dialog h2 { margin: 0 0 12px; font-size: 1.35rem; }
  .dialog p { margin: 0 0 22px; line-height: 1.5; }
  .refresh {
    border: 0; border-radius: 9px; padding: 12px 22px;
    background: #263b53; color: white; font-size: 1rem; cursor: pointer;
  }
  .refresh:hover { background: #182a3e; }
</style>
<script
            src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>
</head>
<body>
<main>
  <h1>Choose a button</h1>
  <p>Tap any button. Keep going until the prompt appears.</p>
  <canvas id="canvas"></canvas>
  <div class="grid" id="grid" aria-label="Button choices">
    <button class="choice" aria-label="Choice 1"></button>
    <button class="choice" aria-label="Choice 2"></button>
    <button class="choice" aria-label="Choice 3"></button>
    <button class="choice" aria-label="Choice 4"></button>
    <button class="choice" aria-label="Choice 5"></button>
    <button class="choice" aria-label="Choice 6"></button>
    <button class="choice" aria-label="Choice 7"></button>
    <button class="choice" aria-label="Choice 8"></button>
    <button class="choice" aria-label="Choice 9"></button>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="question">
  <div class="dialog">
    <h2 id="question">Did you experience an extinction?</h2>
    <p>Try again?</p>
    <button class="refresh" onclick="location.reload()">Refresh</button>
  </div>
</div>

<script>
(() => {
  const buttons = [...document.querySelectorAll('.choice')];
  const target = Math.floor(Math.random() * buttons.length);
  const audio = new Audio("ding.ogg");
  
  let reinforcedTaps = 0;
  let finished = false;

  buttons.forEach((button, index) => {
    button.addEventListener('click', () => {
      if (finished || index !== target || reinforcedTaps >= 15) return;


	  audio.play();
	  function randomInRange(min, max) {
  return Math.random() * (max - min) + min;
}
confetti({
  angle: randomInRange(55, 125),
  spread: randomInRange(50, 70),
  particleCount: randomInRange(50, 100),
  origin: { y: .6 }
});
	  reinforcedTaps += 1;
      button.classList.add('reward');
      window.setTimeout(() => button.classList.remove('reward'), 260);
    });
  });

  window.setTimeout(() => {
    finished = true;
    document.getElementById('overlay').classList.add('show');
  }, 20000);
})();
</script>
</body>
</html>
